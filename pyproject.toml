[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-forecaster"
version = "0.1.0"
description = "Evidence-first, scenario-based stock research agent (informational research, not investment advice)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5,<3",
    "httpx>=0.25,<1",
    "typer>=0.9,<1",
    "fastapi>=0.104,<1",
    "uvicorn>=0.24,<1",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
openai = ["openai>=1.10"]
anthropic = ["anthropic>=0.20"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "types-requests"]

[project.scripts]
stock-forecaster = "stock_forecaster.cli:app"

[tool.setuptools.packages.find]
include = ["stock_forecaster*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
